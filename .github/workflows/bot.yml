name: food-bot

on:
  schedule:
    # Время в UTC (Москва = UTC+3). GitHub может запускать с опозданием на 5–20 минут.
    - cron: "1 2 * * *"           # 05:01 МСК — итог за прошедший день (GitHub часто опаздывает;
    - cron: "37 2 * * *"          # основной будильник — Apps Script, файл Daily.gs)
  workflow_dispatch: {}           # ручной запуск и запуск приёмщиком после каждого сообщения

concurrency:
  group: food-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.12"
      # готовое окружение с библиотеками из кеша — не ставим их заново каждый запуск
      - uses: actions/cache@v4
        id: venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.py.outputs.python-version }}-${{ hashFiles('requirements.txt') }}
      - if: steps.venv.outputs.cache-hit != 'true'
        run: python -m venv .venv && .venv/bin/pip install -q -r requirements.txt
      - run: .venv/bin/python -m bot.main
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
