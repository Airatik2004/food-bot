name: food-bot

on:
  schedule:
    # Время в UTC (Москва = UTC+3). GitHub может запускать с опозданием на 5–20 минут.
    - cron: "1,31 18-21 * * *"    # 21:01 ... 00:31 МСК — уточнения, отчёт, напоминания
    - cron: "1 22 * * *"          # 01:01 МСК — последний срок, отчёт «примерно»
  workflow_dispatch: {}           # ручной запуск и запуск приёмщиком после каждого сообщения

concurrency:
  group: food-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m bot.main
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
